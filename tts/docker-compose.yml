services:
  malayalam_tts:
    image: ghcr.io/matatonic/openedai-speech:latest
    container_name: malayalam_tts_api
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./models:/app/voices/piper  # Map to a 'piper' subfolder
      - ./config:/app/config
    environment:
      - TTS_HOME=piper
      - DEFAULT_VOICE=ml_IN-meera-medium
    command: ["python", "speech.py", "--xtts_device", "none"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
